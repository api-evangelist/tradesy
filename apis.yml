name: Tradesy
description: Tradesy was a Los Angeles-based online marketplace for buying and selling pre-owned luxury
  and designer fashion, founded in 2009 and backed by 500 Global among others. In March 2022 it was
  acquired by Paris-based Vestiaire Collective to accelerate that company's expansion into the US resale
  market, and the standalone Tradesy brand was subsequently wound down. The tradesy.com domain now
  redirects to vestiairecollective.com, and Tradesy no longer operates an independent website, developer
  program, or public API. This profile is retained as a historical/acquired-company record.
